<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1F35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KyKy">
<meta name="robots" content="noindex, nofollow">
<title>KyKy Shoes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first app shell, sticky header + bottom tab bar, content column max 760px. */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --sunken:#ECECE9; --ink:#17171B; --muted:#686870; --line:#E1E0DC;
  --accent:#7A1F35; --accent-ink:#FFFFFF; --accent-soft:#F4E3E7;
  --good:#1D6B45; --good-soft:#DDF0E5; --warn:#8A5A00; --warn-soft:#FBEFCF;
  --bad:#A5281F; --bad-soft:#F8DEDB; --info:#2C4FA0; --info-soft:#DFE7F8; --idle:#5E5E66; --idle-soft:#E6E6E4;
  --back:#6A3FA0; --back-soft:#ECE3F7;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,20,30,.06),0 4px 14px rgba(20,20,30,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111114; --surface:#1B1B20; --sunken:#24242A; --ink:#EDEDF0; --muted:#9C9CA6; --line:#2E2E36;
  --accent:#E58AA0; --accent-ink:#1A0A10; --accent-soft:#3A1E27;
  --good:#6FD39E; --good-soft:#173527; --warn:#F0C062; --warn-soft:#3A2E12;
  --bad:#FF8A80; --bad-soft:#3E1D1A; --info:#9DB7FF; --info-soft:#1E2945; --idle:#A8A8B0; --idle-soft:#2A2A30;
  --back:#C9A8F5; --back-soft:#2C2240;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111114; --surface:#1B1B20; --sunken:#24242A; --ink:#EDEDF0; --muted:#9C9CA6; --line:#2E2E36;
  --accent:#E58AA0; --accent-ink:#1A0A10; --accent-soft:#3A1E27;
  --good:#6FD39E; --good-soft:#173527; --warn:#F0C062; --warn-soft:#3A2E12;
  --bad:#FF8A80; --bad-soft:#3E1D1A; --info:#9DB7FF; --info-soft:#1E2945; --idle:#A8A8B0; --idle-soft:#2A2A30;
  --back:#C9A8F5; --back-soft:#2C2240;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:20px}
h2{font-size:15px;font-weight:600}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13px}
.iconbtn:hover{background:var(--sunken)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap}

main{max-width:760px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.grid3.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}

/* KPI */
.hero{background:var(--ink);color:var(--bg);border:0}
.hero .label{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .sub{font-size:13px;color:color-mix(in srgb,var(--bg) 78%,transparent);margin-top:6px}
.prog{height:8px;border-radius:4px;background:color-mix(in srgb,var(--bg) 22%,transparent);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero .prog i{background:var(--bg)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.good{border-color:var(--good);background:var(--good-soft)} .kpi.good .v{color:var(--good)}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)} .kpi.bad .v{color:var(--bad)}
.meter{position:relative;height:6px;background:var(--sunken);border-radius:3px;margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--good)}
.meter.over i{background:var(--bad)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{background:var(--warn-soft);color:var(--warn)}
.p-sent{background:var(--info-soft);color:var(--info)}
.p-ok{background:var(--good-soft);color:var(--good)}
.p-ret{background:var(--bad-soft);color:var(--bad)}
.p-back{background:var(--back-soft);color:var(--back)}
.p-cancel{background:var(--idle-soft);color:var(--idle)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunken);color:var(--muted)}

/* status groups */
.groups{display:flex;flex-direction:column}
.grp{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.grp:last-child{border-bottom:0}
.grp .dot{width:10px;height:10px;border-radius:50%}
.grp .n{font-weight:700;min-width:36px;text-align:right}
.grp .m{min-width:96px;text-align:right;color:var(--muted)}
.grp.tot{cursor:default;font-weight:700}
.grp.tot .m{color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none}
.alert .t{flex:1;min-width:0}
.alert .go{color:var(--muted);font-size:13px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px}
.seg{display:flex;background:var(--sunken);border-radius:10px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t3{grid-column:1/-1;font-size:13px}
.item .r1{text-align:right;font-weight:600}
.item .r2{text-align:right}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}

/* horizontal bars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{grid-column:1/-1;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* stock rows */
.sk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.sk:last-child{border-bottom:0}
.sk .rk{grid-row:1/4;font-weight:700;color:var(--muted);font-size:13px;padding-top:2px}
.sk .nm{font-weight:600;min-width:0}
.sk .st{text-align:right}
.sk .ln{grid-column:2/4;font-size:13px;color:var(--muted)}
.sk .ln b{color:var(--ink);font-weight:600}
.sug{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;border-radius:6px;padding:2px 7px;margin-left:6px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;min-width:0}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;font-size:15px;background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);color:var(--surface)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:8px 12px;font-size:13px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:0;margin-bottom:8px}

/* size picker */
.sizes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.size{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.size b{font-size:17px}
.size small{font-size:11px;color:var(--muted)}
.size.low small{color:var(--warn);font-weight:600}
.size.out small{color:var(--bad);font-weight:600}
.size:active{transform:scale(.97)}
.cart{display:flex;flex-direction:column;gap:6px}
.cart-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunken)}
.cart-row .n{flex:1;min-width:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.qty button{border:0;background:none;width:32px;height:32px;cursor:pointer;font-size:18px}
.qty span{min-width:22px;text-align:center;font-weight:600}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:6px;background:var(--sunken)}
.sw-den{background:#1A1A1A}.sw-kem{background:#EADBC2}

.money{display:flex;flex-direction:column;gap:6px;font-size:14px}
.money div{display:flex;justify-content:space-between;gap:10px}
.money .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:16px}
.money .neg b{color:var(--bad)}

.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.imp-grid input{width:56px;text-align:center;padding:8px 4px}
.imp-grid td,.imp-grid th{padding:4px 3px;text-align:center}
.imp-grid th:first-child,.imp-grid td:first-child{text-align:left}

.content{display:flex;flex-direction:column;gap:8px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.content:last-child{border-bottom:0}
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ct{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-width:0}
.ct input{position:absolute;opacity:0;pointer-events:none}
.ct:has(input:checked){border-color:var(--accent,var(--good));box-shadow:0 0 0 2px var(--accent,var(--good)) inset}
.ct:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.ct .th{position:relative;flex:0 0 48px;width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--line);display:flex;align-items:center;justify-content:center}
.ct .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ct .th i{font-style:normal;font-size:10px;color:var(--muted)}
.ct .tx{display:flex;flex-direction:column;min-width:0;font-size:13px}
.ct .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ct .tx small{color:var(--muted);font-size:11px}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.sync .dot.off{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px}
.bars .b{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bars .b i{display:block;background:var(--accent,var(--good));border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.bars .b.zero i{background:var(--line);opacity:1}
.bars .b.today i{outline:2px solid var(--ink);outline-offset:1px}
.bars-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.verdict{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.v-good{background:var(--good-soft);color:var(--good)} .v-bad{background:var(--bad-soft);color:var(--bad)} .v-warn{background:var(--warn-soft);color:var(--warn)}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.content .key{font-size:13px}
.content .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;font-size:13px}
.content .stats span{color:var(--muted);display:block;font-size:11px}
.share{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.share i{display:block;height:100%;background:var(--accent)}

details.slip{border-bottom:1px solid var(--line);padding:10px 2px}
details.slip:last-child{border-bottom:0}
details.slip summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
details.slip summary::-webkit-details-marker{display:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(16px,calc((100vw - 760px)/2 + 16px),env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:0 6px 18px rgba(122,31,53,.3);cursor:pointer;font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(10,10,14,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{max-width:760px;margin:0 auto;padding-block:8px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
.sheet-h{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.sheet-h h3{flex:1;font-size:18px;min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}

.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;padding:22px}
.login-card .brand{margin-bottom:4px}
input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:var(--surface)}
.loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>

<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>KyKy</b><span id="subtitle">Quản trị bán hàng</span></div>
  <div class="sp"></div>
  <span class="demo" id="demoBadge" hidden>Dữ liệu mẫu</span>
  <button class="iconbtn" id="userBtn" type="button" hidden aria-label="Đăng xuất"></button>
  <button class="iconbtn" id="refreshBtn" type="button" aria-label="Tải lại dữ liệu">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    <span id="syncTime" class="num">--:--</span>
  </button>
</div></header>

<main>
  <!-- TỔNG QUAN -->
  <section class="view" id="v-home">
    <div class="row between"><h1>Tổng quan</h1><select id="monthSel" aria-label="Chọn tháng" style="width:auto"></select></div>
    <div class="card hero" id="revCard"></div>
    <div class="grid2" id="homeKpis"></div>
    <div class="card">
      <div class="card-h"><h2>Tình trạng đơn</h2><button class="link" type="button" id="toOrders">Mở Đơn hàng →</button></div>
      <div class="groups num" id="homeGroups"></div>
    </div>
    <div class="alerts" id="alerts"></div>
  </section>

  <!-- ĐƠN HÀNG -->
  <section class="view" id="v-orders" hidden>
    <h1>Đơn hàng</h1>
    <div class="card row between" id="ghnBar" hidden style="gap:10px;flex-wrap:wrap"></div>
    <div class="chips" id="rangeChips"></div>
    <div class="grid2" id="customRange" hidden>
      <div class="field"><label for="rFrom">Từ ngày</label><input type="date" id="rFrom"></div>
      <div class="field"><label for="rTo">Đến ngày</label><input type="date" id="rTo"></div>
    </div>
    <div class="seg" id="orderSeg" role="group" aria-label="Phần xem">
      <button type="button" data-s="sum">Tổng hợp</button><button type="button" data-s="log">Nhật ký</button><button type="button" data-s="stat">Thống kê</button>
    </div>
    <div id="o-sum" class="view"></div>
    <div id="o-log" class="view" hidden>
      <input type="search" id="orderSearch" placeholder="Tìm tên, SĐT, mã đơn, mã GHN, phường/xã">
      <div class="chips" id="statusChips"></div>
      <div class="card" style="padding:4px 12px"><div class="list" id="orderList"></div></div>
    </div>
    <div id="o-stat" class="view" hidden></div>
  </section>

  <!-- KHO -->
  <section class="view" id="v-stock" hidden>
    <div class="row between"><h1>Kho hàng</h1><button class="btn sm primary" id="importBtn" type="button">Nhập hàng</button></div>
    <div class="chips" id="modelChips"></div>
    <div class="grid4" id="stockKpis"></div>
    <div class="card">
      <div class="card-h"><h2>Từng mã giày</h2><span class="muted small" id="stockNote"></span></div>
      <div class="seg" id="stockSeg" role="group" aria-label="Sắp xếp" style="margin-bottom:6px">
        <button type="button" data-s="prio">Ưu tiên nhập</button><button type="button" data-s="fast">Bán chạy</button><button type="button" data-s="much">Tồn nhiều</button><button type="button" data-s="old">Tồn lâu</button>
      </div>
      <div id="skuList"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Hàng hoàn</h2></div>
      <div class="grid2" id="retKpis" style="margin-bottom:6px"></div>
      <div class="list" id="retList"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Phiếu nhập</h2><span class="muted small" id="owedNote"></span></div>
      <div id="slipList"></div>
    </div>
  </section>

  <!-- QUẢNG CÁO -->
  <section class="view" id="v-ads" hidden>
    <div class="row between"><h1>Quảng cáo</h1><select id="adsMonth" aria-label="Chọn kỳ" style="width:auto"></select></div>
    <div class="grid2" id="adsKpis"></div>
    <div class="sync" id="adsSync"></div>
    <div class="card" id="adsChartCard">
      <div class="card-h"><h2>Chi theo ngày</h2><span class="muted small num" id="adsChartNote"></span></div>
      <div class="bars" id="adsChart"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Nội dung quảng cáo</h2><span class="muted small">Tự cập nhật từ Meta</span></div>
      <div id="contentList"></div>
    </div>
  </section>

  <!-- SỔ QUỸ -->
  <section class="view" id="v-cash" hidden>
    <div class="row between"><h1>Sổ quỹ</h1><button class="btn sm" id="cashAddBtn" type="button">Ghi thu chi</button></div>
    <div class="card hero" id="cashHero"></div>
    <div class="grid2" id="cashKpis"></div>
    <div class="card">
      <div class="card-h"><h2>Số dư được tính thế nào</h2></div>
      <div class="money num" id="cashBreak"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Thu chi ghi tay</h2><span class="muted small">Vốn, vật tư, lương, chi khác</span></div>
      <div class="list" id="cashList"></div>
    </div>
  </section>
</main>

<button class="fab" id="fab" type="button">+ Tạo đơn</button>

<nav class="nav" aria-label="Điều hướng"><div class="nav-in">
  <button type="button" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tổng quan</button>
  <button type="button" data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l2 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z"/><path d="M4 7h16M9 11h6"/></svg>Đơn hàng</button>
  <button type="button" data-v="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h12c2 0 3-1 4-3l2-5"/><path d="M3 18v-3c3 0 5-2 7-6l1-2"/><path d="M19 15v5"/></svg>Kho</button>
  <button type="button" data-v="ads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>Quảng cáo</button>
  <button type="button" data-v="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Sổ quỹ</button>
</div></nav>

<div id="layer"></div>

<div class="login" id="login" hidden>
  <form class="card login-card" id="loginForm">
    <div class="brand"><b>KyKy</b><span>Quản trị bán hàng</span></div>
    <div class="field"><label for="lUser">Tên đăng nhập</label><input type="text" id="lUser" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="lPass">Mật khẩu</label><input type="password" id="lPass" autocomplete="current-password" required></div>
    <div class="muted small" id="lErr" role="alert"></div>
    <button class="btn primary block" type="submit">Đăng nhập</button>
  </form>
</div>

function D(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }

function modelPrice(m,n){ if(!m||n<=0) return 0; return n<=4 ? (m.p[n]||0) : n*m.p5; }
function shipFull(S,o){ return o.shipActual!==''&&o.shipActual!=null ? Number(o.shipActual) : S.shipBase + S.shipExtra*Math.max(0,o.pairs-1); }

function compute(R){
  var S=R.settings, T=R.today, X={raw:R,S:S,today:T,lists:R.lists};
  X.models=R.models; X.modelBy={}; R.models.forEach(function(m){ X.modelBy[m.code]=m; });
  X.skuBy={};
  X.skus=R.skus.map(function(s){
    var q=0,v=0; R.imports.forEach(function(i){ if(i.sku===s.code){ q+=i.qty; v+=i.qty*i.unit; } });
    var m=X.modelBy[s.model];
    var o=Object.assign({},s,{cost:q?v/q:(m?m.costRef:0), name:s.color+', '+s.height+', size '+s.size,
      short:s.color+' '+String(s.height).replace(' phân','p')+' · '+s.size});
    X.skuBy[s.code]=o; return o;
  });
  var byCode={};
  X.orders=R.orders.map(function(o){ var x=Object.assign({},o,{lines:[],pairs:0}); byCode[x.code]=x; return x; });
  X.byCode=byCode;
  X.lines=R.lines.map(function(l){
    var s=X.skuBy[l.sku]||{model:'',cost:0,short:l.sku,name:l.sku,color:'',height:'',size:''};
    var o=byCode[l.code];
    var x={code:l.code,sku:l.sku,qty:l.qty,s:s,model:s.model,order:o,status:o?o.status:'Không thấy đơn',date:o?o.date:''};
    if(o){ o.lines.push(x); o.pairs+=l.qty; }
    return x;
  });
  X.lines.forEach(function(l){
    if(!l.order){ l.price=0; return; }
    var n=sum(l.order.lines.filter(function(y){return y.model===l.model;}),'qty'), m=X.modelBy[l.model];
    l.price=m ? l.qty*(n<=4 ? (m.p[n]||0)/n : m.p5) : 0;
    l.cost=l.qty*l.s.cost;
  });
  X.orders.forEach(function(o){
    var st=o.status;
    o.list=sum(o.lines,'price'); o.cod=o.list-(o.discount||0); o.cost=sum(o.lines,function(l){return l.qty*l.s.cost;});
    o.ship=isIdle(st)?0:shipFull(S,o); o.pack=isIdle(st)?0:o.pairs*S.pack; o.retFee=isRet(st)?S.returnFee:0;
    o.profit=st==='Giao thành công'?o.cod-o.cost-o.ship-o.pack:(isRet(st)?-(o.ship+o.pack+o.retFee):0);
    o.exp=isOpen(st)?(1-S.returnRate)*(o.cod-o.cost)-shipFull(S,o)-o.pairs*S.pack-S.returnRate*S.returnFee:0;
    o.addr=[o.address,o.ward,o.province].filter(Boolean).join(', ');
    o.sizes=o.lines.map(function(l){ return l.s.short+(l.qty>1?' ×'+l.qty:''); }).join(', ');
  });
  // kho
  var since=addDays(T,-S.salesDays);
  X.stock=X.skus.map(function(s){
    var ls=X.lines.filter(function(l){return l.sku===s.code;});
    var q=function(st){ return sum(ls.filter(function(l){return l.status===st;}),'qty'); };
    var lots=R.imports.filter(function(i){return i.sku===s.code;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var imported=sum(lots,'qty'), sent=q('Đã gửi'), returning=q('Đang hoàn'), sold=q('Giao thành công'), held=q('Mới chốt');
    var inStock=imported-sent-returning-sold, avail=inStock-held, own=inStock+sent+returning;
    var recent=sum(ls.filter(function(l){ return l.order&&l.status!=='Hủy'&&!isRet(l.status)&&l.date>=since; }),'qty');
    var perDay=recent/S.salesDays, reorder=ceil(S.minStock+perDay*S.leadDays);
    var suggest=avail<reorder?ceil(S.minStock+perDay*(S.leadDays+S.cycleDays))-avail:0;
    var state=avail<=0?'Hết hàng':(avail<reorder?((perDay>0&&avail<perDay*S.leadDays)?'Cần nhập gấp':'Sắp hết'):(recent===0?'Chưa bán được':(avail>perDay*60?'Tồn nhiều':'Đủ hàng')));
    // tuổi tồn: lô cũ nhất còn hàng (xuất trước nhập trước)
    var used=imported-inStock, oldest='';
    for(var i=0;i<lots.length;i++){ if(used>=lots[i].qty){ used-=lots[i].qty; continue; } oldest=lots[i].date; break; }
    return {sku:s.code,s:s,model:s.model,imported:imported,inStock:inStock,held:held,avail:avail,sent:sent,returning:returning,own:own,sold:sold,
      recent:recent,perDay:perDay,days:perDay>0?Math.floor(avail/perDay):null,last:lots.length?lots[lots.length-1].date:'',
      cost:s.cost,ownValue:own*s.cost,reorder:reorder,suggest:suggest,state:state,oldest:inStock>0?oldest:'',age:inStock>0&&oldest?daysBetween(oldest,T):null};
  });
  // phiếu nhập
  var slips={}; X.slips=[];
  R.imports.forEach(function(i){ var s=slips[i.slip]; if(!s){ s=slips[i.slip]={slip:i.slip,date:i.date,items:[],qty:0,total:0,paid:0,note:i.note}; X.slips.push(s); }
    s.items.push(i); s.qty+=i.qty; s.total+=i.qty*i.unit; s.paid+=i.paid; });
  X.slips.forEach(function(s){ s.owed=s.total-s.paid; });
  X.slips.sort(function(a,b){ return a.slip<b.slip?1:-1; });
  // sổ quỹ (giống tab Thu chi cột H–I)
  var C={};
  C.inManual=sum(R.cash.filter(function(c){return c.type==='Thu';}),'amount');
  C.received=sum(X.orders.filter(function(o){return o.status==='Giao thành công';}),'cod');
  C.ghn=sum(X.orders.filter(function(o){return o.status==='Giao thành công'||isRet(o.status);}),'ship')+sum(X.orders.filter(function(o){return isRet(o.status);}),'retFee');
  C.paidFactory=sum(R.imports,'paid'); C.ads=sum(R.ads,'spend');
  C.outManual=sum(R.cash.filter(function(c){return c.type==='Chi';}),'amount');
  C.balance=C.inManual+C.received-C.ghn-C.paidFactory-C.ads-C.outManual;
  C.transit=sum(X.orders.filter(function(o){return o.status==='Đã gửi';}),'cod');
  C.owed=sum(X.slips,'owed');
  X.cash=C;
  // các tháng
  var last=T.slice(0,7); X.orders.forEach(function(o){ if(o.date&&o.date.slice(0,7)>last) last=o.date.slice(0,7); });
  var m=(S.startDate||T).slice(0,7); X.months=[]; while(m<=last&&X.months.length<60){ X.months.push(m); m=addMonths(m,1); }
  if(!X.months.length) X.months=[T.slice(0,7)];
  return X;
}

function stats(from,to){
  var S=DB.S, os=DB.orders.filter(function(o){ return o.date>=from&&o.date<=to; });
  var live=os.filter(function(o){return o.status!=='Hủy';}), ok=os.filter(function(o){return o.status==='Giao thành công';}), rt=os.filter(function(o){return isRet(o.status);});
  var r={orders:os, n:live.length, revenue:sum(live,'cod'), pairs:sum(live,'pairs'), delivered:ok.length, real:sum(ok,'cod'), returned:rt.length};
  r.gross=r.real-sum(ok,'cost')-sum(ok,'ship')-sum(rt,'ship')-sum(ok,'pack')-sum(rt,'pack')-sum(rt,'retFee');
  r.ads=sum(DB.raw.ads.filter(function(a){return a.date>=from&&a.date<=to;}),'spend');
  r.other=sum(DB.raw.cash.filter(function(c){return c.date>=from&&c.date<=to&&c.type==='Chi'&&(c.category==='Lương nhân viên'||c.category==='Marketing khác'||c.category==='Chi khác');}),'amount');
  r.net=r.gross-r.ads-r.other; r.expected=r.net+sum(os,'exp');
  r.adsRatio=r.revenue?r.ads/r.revenue:null; r.cpa=r.n?r.ads/r.n:null; r.avgOrder=r.n?r.revenue/r.n:null; r.avgPair=r.pairs?r.revenue/r.pairs:null;
  r.retRate=(r.delivered+r.returned)?r.returned/(r.delivered+r.returned):null;
  r.groups={}; STATUS.forEach(function(s){ var g=os.filter(function(o){return o.status===s;}); r.groups[s]={n:g.length,money:sum(g,'cod')}; });

}

/* ---------- chọn giày ---------- */
function picker(container,cart,onChange,ownHeld){
  var models=DB.models.filter(function(m){return m.active;}); if(!models.length) models=DB.models;
  var st={model:models[0]?models[0].code:'',color:'',height:''};
  function opts(field){ var out=[]; DB.skus.forEach(function(s){ if(s.model===st.model&&(field!=='height'||s.color===st.color)&&out.indexOf(s[field])<0) out.push(s[field]); }); return out; }
  function avail(code){ var s=DB.stock.filter(function(x){return x.sku===code;})[0]; var a=s?s.avail:0; return a+(ownHeld&&ownHeld[code]||0); }
  function inCart(code){ var c=cart.filter(function(x){return x.sku===code;})[0]; return c?c.qty:0; }
  function draw(){
    if(opts('color').indexOf(st.color)<0) st.color=opts('color')[0]||'';
    if(opts('height').indexOf(st.height)<0) st.height=opts('height')[0]||'';
    var h='';
    if(models.length>1) h+='<div class="chips">'+models.map(function(m){ return '<button type="button" class="chip" data-m="'+esc(m.code)+'" aria-pressed="'+(st.model===m.code)+'">'+esc(m.name)+'</button>'; }).join('')+'</div>';
    h+='<div class="chips">'+opts('color').map(function(c){ return '<button type="button" class="chip" data-c="'+esc(c)+'" aria-pressed="'+(st.color===c)+'">'+sw(c)+esc(c)+'</button>'; }).join('')+
      opts('height').map(function(c){ return '<button type="button" class="chip" data-h="'+esc(c)+'" aria-pressed="'+(st.height===c)+'">'+esc(c)+'</button>'; }).join('')+'</div>';
    var sizes=DB.skus.filter(function(s){ return s.model===st.model&&s.color===st.color&&s.height===st.height; }).sort(function(a,b){return a.size-b.size;});
    h+='<div class="sizes num">'+sizes.map(function(s){ var left=avail(s.code)-inCart(s.code);
      return '<button type="button" class="size '+(left<=0?'out':left<=2?'low':'')+'" data-sku="'+esc(s.code)+'" aria-label="Thêm size '+s.size+', còn '+left+' đôi"><b>'+s.size+'</b><small>'+(left<=0?'hết':'còn '+left)+'</small></button>'; }).join('')+'</div>';
    h+='<div class="cart">'+cart.map(function(c,i){ var s=DB.skuBy[c.sku]||{short:c.sku,color:''};
      return '<div class="cart-row"><span class="n">'+sw(s.color)+esc(s.short)+(models.length>1?' <span class="tag">'+esc(s.model)+'</span>':'')+'</span><span class="qty"><button type="button" data-dec="'+i+'" aria-label="Bớt 1">−</button><span class="num">'+c.qty+'</span><button type="button" data-inc="'+i+'" aria-label="Thêm 1">+</button></span></div>'; }).join('')+'</div>';
    container.innerHTML=h;
    container.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ st.model=b.dataset.m; draw(); }; });
    container.querySelectorAll('[data-c]').forEach(function(b){ b.onclick=function(){ st.color=b.dataset.c; draw(); }; });
    container.querySelectorAll('[data-h]').forEach(function(b){ b.onclick=function(){ st.height=b.dataset.h; draw(); }; });
    container.querySelectorAll('[data-sku]').forEach(function(b){ b.onclick=function(){ var c=cart.filter(function(x){return x.sku===b.dataset.sku;})[0]; if(c) c.qty++; else cart.push({sku:b.dataset.sku,qty:1});
      if(avail(b.dataset.sku)-inCart(b.dataset.sku)<0) toast('Mã này đã hết hàng có thể bán. Vẫn thêm được nếu chắc chắn có hàng.'); draw(); onChange(); }; });
    container.querySelectorAll('[data-inc]').forEach(function(b){ b.onclick=function(){ cart[b.dataset.inc].qty++; draw(); onChange(); }; });
    container.querySelectorAll('[data-dec]').forEach(function(b){ b.onclick=function(){ var c=cart[b.dataset.dec]; c.qty--; if(c.qty<=0) cart.splice(b.dataset.dec,1); draw(); onChange(); }; });
  }
  draw();
}
function cartPrice(cart){
  var by={}; cart.forEach(function(c){ var s=DB.skuBy[c.sku]; if(!s) return; by[s.model]=(by[s.model]||0)+c.qty; });
  var rows=Object.keys(by).map(function(m){ var md=DB.modelBy[m]; return {model:m,name:md?md.name:m,n:by[m],price:modelPrice(md,by[m])}; });
  return {rows:rows,total:sum(rows,'price'),pairs:sum(rows,'n')};
}
function priceHtml(cart,discount){
  var p=cartPrice(cart), d=Number(discount)||0;
  if(!p.pairs) return '<div class="muted small">Chọn giày để xem giá.</div>';
  return '<div class="money num">'+p.rows.map(function(r){ return '<div><span class="muted">'+esc(r.name)+' · '+r.n+' đôi</span><b>'+money(r.price)+' đ</b></div>'; }).join('')+
    (d?'<div><span class="muted">Giảm giá</span><b>−'+money(d)+' đ</b></div>':'')+'<div class="tot"><span>Thu COD</span><b>'+money(p.total-d)+' đ</b></div></div>';
}

  $('modelChips').hidden=models.length<2;

    kpiBox('Đang vận chuyển',sum(rows,'sent')+' đôi','vẫn là hàng của mình')+kpiBox('Đang hoàn về',sum(rows,'returning')+' đôi','sẽ về lại kho')+
    kpiBox('Hàng của mình',sum(rows,'own')+' đôi','vốn '+k(sum(rows,'ownValue'))+' đ');
  document.querySelectorAll('#stockSeg button').forEach(function(b){ b.setAttribute('aria-pressed',b.dataset.s===SSORT); });

    fast:function(a,b){ return b.recent-a.recent||a.avail-b.avail; }, much:function(a,b){ return b.inStock-a.inStock||a.recent-b.recent; },
    old:function(a,b){ return (b.age===null?-1:b.age)-(a.age===null?-1:a.age)||b.inStock-a.inStock; }}[SSORT];
  rows=rows.slice().sort(cmp);
  $('stockNote').textContent='Bán gần đây = '+DB.S.salesDays+' ngày qua';
  $('skuList').innerHTML=rows.map(function(s,i){
    return '<button type="button" class="sk" data-sku="'+esc(s.sku)+'"><span class="rk num">'+(i+1)+'</span><span class="nm">'+sw(s.s.color)+esc(s.s.short)+(DB.models.length>1?' <span class="tag">'+esc(s.model)+'</span>':'')+(s.suggest?'<span class="sug">+'+s.suggest+'</span>':'')+'</span>'+
      '<span class="st"><span class="pill '+SPILL[s.state]+'">'+s.state+'</span></span>'+
      '<span class="ln num">Có thể bán <b>'+s.avail+'</b>'+(s.held?' · giữ '+s.held:'')+(s.sent?' · đang giao '+s.sent:'')+(s.returning?' · đang hoàn '+s.returning:'')+'</span>'+
      '<span class="ln num">Bán '+DB.S.salesDays+' ngày: <b>'+s.recent+'</b>'+(s.days!==null?' · đủ bán ~'+s.days+' ngày':'')+(s.age!==null?' · tồn lâu nhất '+s.age+' ngày':'')+'</span></button>'; }).join('')||'<div class="empty">Chưa có mã giày nào.</div>';
  $('skuList').querySelectorAll('.sk').forEach(function(b){ b.addEventListener('click',function(){ stockDetail(b.dataset.sku); }); });
  // hàng hoàn
  var ret=DB.orders.filter(function(o){ return o.status==='Đang hoàn'; }), back=DB.orders.filter(function(o){ return o.status==='Đã hoàn về kho'; });
  $('retKpis').innerHTML=kpiBox('Đang hoàn về',ret.length+' đơn · '+sum(ret,'pairs')+' đôi','tiền hàng '+money(sum(ret,'cost'))+' đ')+kpiBox('Đã hoàn về kho',back.length+' đơn · '+sum(back,'pairs')+' đôi','tiền hàng '+money(sum(back,'cost'))+' đ · đã bán lại được');
  $('retList').innerHTML=ret.length?ret.map(function(o){ return '<div class="item" style="cursor:default"><span class="t1">'+esc(o.name)+' <span class="mono muted">'+esc(o.code)+'</span></span><span class="r1"><button type="button" class="btn sm primary" data-back="'+esc(o.code)+'">Đã về kho</button></span><span class="t2">'+esc(o.sizes)+' · tiền hàng '+money(o.cost)+' đ'+(o.doneDate?' · hoàn từ '+dm(o.doneDate):'')+'</span><span></span></div>'; }).join('')
    :'<div class="empty">Không có đơn nào đang hoàn.</div>';
  $('retList').querySelectorAll('[data-back]').forEach(function(b){ b.addEventListener('click',function(){ run(api('updateOrder',b.dataset.back,JSON.stringify({status:'Đã hoàn về kho'})),'Đã cộng hàng hoàn vào kho'); }); });
  // phiếu nhập
  var owed=sum(DB.slips,'owed'); $('owedNote').textContent=owed?'Còn nợ xưởng '+money(owed)+' đ':'Đã trả đủ';
  $('slipList').innerHTML=DB.slips.length?DB.slips.map(function(s){
    return '<details class="slip"><summary><span><b class="mono">'+esc(s.slip)+'</b> · '+dmy(s.date)+'</span><span class="num"><b>'+money(s.total)+' đ</b></span>'+
      '<span class="muted small num">'+s.qty+' đôi · '+s.items.length+' mã'+(s.note?' · '+esc(s.note):'')+'</span><span class="small num" style="text-align:right;color:'+(s.owed>0?'var(--bad)':'var(--good)')+'">'+(s.owed>0?'nợ '+money(s.owed):'đã trả đủ')+'</span></summary>'+
      '<div class="scroll-x" style="margin-top:8px"><table class="tbl num"><tr><th>Mã</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr>'+s.items.map(function(i){ var sk=DB.skuBy[i.sku]; return '<tr><td>'+esc(sk?sk.short:i.sku)+'</td><td>'+i.qty+'</td><td>'+money(i.unit)+'</td><td>'+money(i.qty*i.unit)+'</td></tr>'; }).join('')+'</table></div>'+
      (s.owed>0?'<button type="button" class="btn sm" data-paid="'+esc(s.slip)+'" style="margin-top:8px">Đánh dấu đã trả đủ '+money(s.owed)+' đ</button>':'')+'</details>'; }).join('')
    :'<div class="empty">Chưa có phiếu nhập.</div>';
  $('slipList').querySelectorAll('[data-paid]').forEach(function(b){ b.addEventListener('click',function(){ run(api('markImportPaid',b.dataset.paid),'Đã ghi trả đủ phiếu '+b.dataset.paid); }); });
}
function stockDetail(code){
  var s=DB.stock.filter(function(x){return x.sku===code;})[0]; if(!s) return;
  var lots=DB.raw.imports.filter(function(i){return i.sku===code;}).sort(function(a,b){return a.date<b.date?1:-1;});
  openSheet(sw(s.s.color)+esc(s.s.short),'<div class="row between"><span class="pill '+SPILL[s.state]+'">'+s.state+'</span><span class="mono muted">'+esc(code)+'</span></div>'+
    '<div class="card"><dl class="kv num"><dt>Tổng đã nhập</dt><dd>'+s.imported+' đôi</dd><dt>Trong kho</dt><dd>'+s.inStock+' đôi (giữ cho đơn chưa gửi '+s.held+')</dd><dt>Có thể bán</dt><dd><b>'+s.avail+' đôi</b></dd>'+
    '<dt>Đang vận chuyển</dt><dd>'+s.sent+' đôi</dd><dt>Đang hoàn về</dt><dd>'+s.returning+' đôi</dd><dt>Hàng của mình</dt><dd>'+s.own+' đôi · '+money(s.ownValue)+' đ</dd><dt>Đã giao thành công</dt><dd>'+s.sold+' đôi</dd>'+
    '<dt>Bán '+DB.S.salesDays+' ngày qua</dt><dd>'+s.recent+' đôi · '+s.perDay.toLocaleString('vi-VN',{maximumFractionDigits:2})+' đôi/ngày</dd><dt>Còn đủ bán</dt><dd>'+(s.days===null?'Chưa có tốc độ bán':'~'+s.days+' ngày')+'</dd>'+
    '<dt>Lô cũ nhất còn tồn</dt><dd>'+(s.oldest?dmy(s.oldest)+' ('+s.age+' ngày)':'–')+'</dd><dt>Giá vốn bình quân</dt><dd>'+money(s.cost)+' đ</dd><dt>Điểm cần nhập</dt><dd>'+s.reorder+' đôi</dd><dt>Gợi ý nhập</dt><dd><b>'+s.suggest+' đôi</b></dd></dl></div>'+
    '<div class="card"><div class="label" style="margin-bottom:6px">Các lần nhập</div><table class="tbl num"><tr><th>Phiếu</th><th>Ngày</th><th>SL</th><th>Đơn giá</th></tr>'+lots.map(function(i){ return '<tr><td class="mono">'+esc(i.slip)+'</td><td>'+dmy(i.date)+'</td><td>'+i.qty+'</td><td>'+money(i.unit)+'</td></tr>'; }).join('')+'</table></div>');
}
function openImport(){
  var models=DB.models; var mcode=MODEL!=='all'?MODEL:(models[0]||{}).code;
  function lastUnit(m){ var l=DB.raw.imports.filter(function(i){ var s=DB.skuBy[i.sku]; return s&&s.model===m; }).sort(function(a,b){return a.date<b.date?1:-1;})[0]; return l?l.unit:((DB.modelBy[m]||{}).costRef||''); }
  var html='<form id="impForm" style="display:flex;flex-direction:column;gap:12px">'+
    '<div class="grid2"><div class="field"><label for="iDate">Ngày nhập</label><input type="date" id="iDate" value="'+DB.today+'"></div>'+
    '<div class="field"><label for="iModel">Mẫu</label>'+selectHtml('iModel',models.map(function(m){return [m.code,m.code+' · '+m.name];}),mcode)+'</div></div>'+
    '<div class="field"><label for="iUnit">Đơn giá nhập mỗi đôi (đ)</label><input type="number" id="iUnit" inputmode="numeric" min="0" step="1000" required></div>'+
    '<div class="row between"><span class="label">Số đôi theo màu và size</span><button type="button" class="btn sm" id="fillSug">Điền theo gợi ý</button></div>'+
    '<div class="scroll-x" id="iGrid"></div>'+
    '<label class="check"><input type="checkbox" id="iPaid"> Đã trả tiền xưởng cho phiếu này</label>'+
    '<div class="field"><label for="iNote">Ghi chú</label><input type="text" id="iNote" placeholder="Ví dụ: lô bổ sung size 37"></div>'+
    '<div class="card" style="padding:12px"><div class="row between"><span class="muted">Tổng phiếu</span><b class="num" id="impTotal">0 đôi</b></div></div>'+
    '<button class="btn primary block" type="submit">Lưu phiếu nhập</button></form>';
  openSheet('Phiếu nhập hàng',html,function(){
    function grid(){
      var m=$('iModel').value; $('iUnit').value=lastUnit(m);
      var sk=DB.skus.filter(function(s){return s.model===m;});
      var combos=[], sizes=[]; sk.forEach(function(s){ var c=s.color+'|'+s.height; if(combos.indexOf(c)<0) combos.push(c); if(sizes.indexOf(s.size)<0) sizes.push(s.size); });
      sizes.sort(function(a,b){return a-b;});
      $('iGrid').innerHTML='<table class="imp-grid num"><tr><th></th>'+sizes.map(function(z){return '<th>'+z+'</th>';}).join('')+'</tr>'+combos.map(function(c){ var p=c.split('|');
        return '<tr><td>'+sw(p[0])+esc(p[0])+' '+esc(p[1].replace(' phân','p'))+'</td>'+sizes.map(function(z){ var s=sk.filter(function(x){return x.color===p[0]&&x.height===p[1]&&x.size===z;})[0];
          return '<td>'+(s?'<input type="number" min="0" inputmode="numeric" data-sku="'+esc(s.code)+'" aria-label="'+esc(s.short)+'" placeholder="0">':'')+'</td>'; }).join('')+'</tr>'; }).join('')+'</table>';
      $('iGrid').querySelectorAll('input').forEach(function(i){ i.addEventListener('input',tot); }); tot();
    }
    function tot(){ var n=0; $('iGrid').querySelectorAll('input').forEach(function(i){ n+=Number(i.value)||0; }); $('impTotal').textContent=n+' đôi · '+money(n*(Number($('iUnit').value)||0))+' đ'; }
    $('iModel').addEventListener('change',grid); $('iUnit').addEventListener('input',tot); grid();
    $('fillSug').addEventListener('click',function(){ $('iGrid').querySelectorAll('input').forEach(function(i){ var s=DB.stock.filter(function(x){return x.sku===i.dataset.sku;})[0]; i.value=s&&s.suggest?s.suggest:''; }); tot(); });
    $('impForm').addEventListener('submit',function(e){ e.preventDefault(); var u=Number($('iUnit').value)||0;
      var items=[]; $('iGrid').querySelectorAll('input').forEach(function(i){ var q=Number(i.value)||0; if(q>0) items.push({sku:i.dataset.sku,qty:q,unit:u}); });
      if(!items.length){ toast('Nhập số đôi cho ít nhất 1 mã.',true); return; } if(!u){ toast('Cần nhập đơn giá nhập.',true); return; }
      run(api('addImport',JSON.stringify({date:$('iDate').value,items:items,paid:$('iPaid').checked,note:$('iNote').value.trim()})),function(s){ return 'Đã lưu phiếu '+s; }); });
  });
}

/* ================= QUẢNG CÁO ================= */
$('adsMonth').addEventListener('change',function(){ ADS_MONTH=this.value; renderAds(); });
function adsRange(){ return ADS_MONTH==='all'?['0000-01-01','9999-12-31']:[ADS_MONTH+'-01',monthEnd(ADS_MONTH)]; }
function contentStats(from,to){
  var ads=DB.raw.ads.filter(function(a){return a.date>=from&&a.date<=to;}), total=sum(ads,'spend');
  var os=DB.orders.filter(function(o){return o.date>=from&&o.date<=to&&o.status!=='Hủy';});
  return {total:total,msgs:sum(ads,'msgs'),ads:ads,list:DB.raw.contents.map(function(c){
    var a=ads.filter(function(x){return x.content===c.code;}), o=os.filter(function(x){return x.content===c.code;});
    var spend=sum(a,'spend'), msgs=sum(a,'msgs'), rev=sum(o,'cod');
    return {c:c,spend:spend,msgs:msgs,orders:o.length,rev:rev,cpa:o.length?spend/o.length:null,ratio:rev?spend/rev:null,share:total?spend/total:0,cpm:msgs?spend/msgs:null};
  }).sort(function(a,b){ return (a.c.status==='Đang chạy'?0:1)-(b.c.status==='Đang chạy'?0:1)||b.spend-a.spend; })};
}
function syncAgo(s){ if(!s) return ''; var m=s.match(/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/); if(!m) return s;
  var d=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]), min=Math.round((Date.now()-d)/60000);
  return min<1?'vừa xong':min<60?min+' phút trước':min<1440?Math.floor(min/60)+' giờ trước':m[4]+':'+m[5]+' '+m[3]+'/'+m[2]; }
function renderAds(){
  var S=DB.S; monthOptions($('adsMonth'),ADS_MONTH,true);
  var r=adsRange(), st=stats(r[0],r[1]), cs=contentStats(r[0],r[1]);
  var ratio=st.adsRatio, over=ratio!==null&&ratio>S.kpiAds, running=DB.raw.contents.filter(function(c){return c.status==='Đang chạy';}).length;
  $('adsKpis').innerHTML=kpiBox('Tổng chi quảng cáo',money(st.ads)+' đ','doanh thu chốt '+k(st.revenue))+
    '<div class="kpi '+(ratio===null?'':over?'bad':'good')+'"><div class="label">Chi QC / doanh thu</div><div class="v num">'+pct(ratio)+'</div><div class="s">KPI tối đa '+pct(S.kpiAds)+(ratio!==null?(over?' · đang vượt':' · trong KPI'):'')+'</div>'+meter(ratio,S.kpiAds)+'</div>'+
    kpiBox('CPA trung bình',st.cpa!==null?money(st.cpa)+' đ':'–',st.n+' đơn chốt · '+cs.msgs+' tin nhắn')+kpiBox('Nội dung đang chạy',String(running),DB.raw.contents.length+' nội dung tất cả');

  // dòng trạng thái đồng bộ Meta
  var last=DB.raw.metaLast||'', live=MODE==='script';
  $('adsSync').innerHTML='<span><span class="dot'+(live&&!last?' off':'')+'"></span>'+(live?(last?'Tự động từ Meta · cập nhật '+esc(syncAgo(last)):'Chưa đồng bộ được với Meta'):'Dữ liệu mẫu · trên bản thật số liệu tự về từ Meta mỗi giờ')+'</span>'+
    (live?'<button class="btn sm" type="button" id="adsSyncBtn">Cập nhật ngay</button>':'');
  if($('adsSyncBtn')) $('adsSyncBtn').addEventListener('click',function(){ run(api('syncMeta'),function(n){ return 'Đã cập nhật từ Meta ('+n+' dòng)'; }); });

  // biểu đồ chi theo ngày (chỉ khi chọn 1 tháng)
  if(ADS_MONTH==='all'){ $('adsChartCard').hidden=true; }
  else { $('adsChartCard').hidden=false;
    var last=Number(monthEnd(ADS_MONTH).slice(8)), days=[], mx=0;
    for(var i=1;i<=last;i++){ var d=ADS_MONTH+'-'+(i<10?'0':'')+i, a=cs.ads.filter(function(x){return x.date===d;}), v=sum(a,'spend'), m=sum(a,'msgs'); mx=Math.max(mx,v); days.push({d:d,v:v,m:m}); }
    var active=days.filter(function(x){return x.v>0;});
    $('adsChartNote').textContent=active.length?'TB '+k(cs.total/active.length)+'/ngày chạy · cao nhất '+k(mx):'';
    $('adsChart').hidden=!active.length; var lab0=$('adsChartCard').querySelector('.bars-x'); if(lab0) lab0.hidden=!active.length;
    var emp=$('adsChartEmpty'); if(!emp){ emp=document.createElement('div'); emp.id='adsChartEmpty'; emp.className='empty'; emp.textContent='Chưa có chi tiêu quảng cáo trong tháng này.'; $('adsChartCard').appendChild(emp); } emp.hidden=!!active.length;
    if(active.length) $('adsChart').innerHTML=days.map(function(x){ return '<div class="b'+(x.v?'':' zero')+(x.d===DB.today?' today':'')+'" title="'+dmy(x.d)+': '+money(x.v)+' đ · '+x.m+' tin nhắn"><i style="height:'+(mx?Math.max(x.v/mx*100,x.v?3:1):1)+'%"></i></div>'; }).join('')+'';
    var lab=$('adsChartCard').querySelector('.bars-x'); if(!lab){ lab=document.createElement('div'); lab.className='bars-x num'; $('adsChartCard').appendChild(lab); }
    lab.hidden=!active.length; lab.innerHTML='<span>1</span><span>'+Math.ceil(last/2)+'</span><span>'+last+'</span>';
  }

  // danh sách nội dung: đang chạy hoặc có chi tiêu trong kỳ hiện trước; phần còn lại thu gọn
  var main=cs.list.filter(function(x){return x.c.status==='Đang chạy'||x.spend>0||x.orders>0;}), rest=cs.list.filter(function(x){return main.indexOf(x)<0;});
  function card(x){ var c=x.c, vd='';
    if(x.spend>0){ vd=x.ratio===null?'<span class="verdict v-warn">Chưa ra đơn</span>':x.ratio>S.kpiAds?'<span class="verdict v-bad">Vượt KPI</span>':'<span class="verdict v-good">Hiệu quả</span>'; }
    return '<button type="button" class="content" data-c="'+esc(c.code)+'"><div class="row between" style="width:100%;gap:8px"><span style="min-width:0"><b>'+esc(c.name)+'</b> <span class="tag">'+esc(c.form||'–')+'</span> <span class="mono muted">'+esc(c.code)+'</span></span><span class="row" style="gap:6px;flex-wrap:nowrap">'+vd+pill2(c.status)+'</span></div>'+
      (c.message?'<div class="key"><span class="muted">Thông điệp: </span>'+esc(c.message)+'</div>':'')+
      '<div class="stats num" style="width:100%"><div><span>Đã chi</span>'+money(x.spend)+' đ</div><div><span>Đơn chốt</span>'+x.orders+'</div><div><span>CPA</span>'+(x.cpa!==null?money(x.cpa)+' đ':'–')+'</div>'+
      '<div><span>Chi / doanh thu</span><b style="color:'+(x.ratio===null?'inherit':x.ratio>S.kpiAds?'var(--bad)':'var(--good)')+'">'+pct(x.ratio)+'</b></div><div><span>Tin nhắn</span>'+x.msgs+'</div><div><span>Chi / tin nhắn</span>'+(x.cpm!==null?money(x.cpm)+' đ':'–')+'</div></div>'+
      (x.spend?'<div style="width:100%"><div class="share"><i style="width:'+x.share*100+'%"></i></div><div class="muted small num" style="margin-top:3px">'+pct(x.share)+' tổng chi trong kỳ</div></div>':'')+'</button>'; }
  $('contentList').innerHTML=(main.length?main.map(card).join(''):'<div class="empty">Không có quảng cáo nào chạy trong kỳ này. Khi bật quảng cáo trên Meta, nội dung sẽ tự hiện ở đây.</div>')+
    (rest.length?'<details class="more"><summary>+ '+rest.length+' nội dung đã dừng, không chi tiêu trong kỳ</summary>'+rest.map(card).join('')+'</details>':'');
  $('contentList').querySelectorAll('.content').forEach(function(b){ b.addEventListener('click',function(){ openContent(b.dataset.c); }); });
}
function pill2(s){ var c={'Đang chạy':'p-ok','Tạm dừng':'p-new','Đã tắt':'p-cancel'}[s]||'p-cancel'; return '<span class="pill '+c+'">'+esc(s||'–')+'</span>'; }

  var c=DB.raw.contents.filter(function(x){return x.code===code;})[0]; if(!c) return;
  var hist=DB.raw.ads.filter(function(a){return a.content===c.code;}).sort(function(a,b){return a.date<b.date?1:-1;});
  var html='<div class="card"><div class="row between"><span><span class="tag">'+esc(c.form||'–')+'</span> <span class="mono muted">'+esc(c.code)+'</span></span>'+pill2(c.status)+'</div>'+
    '<div class="muted small" style="margin-top:6px">Bắt đầu '+(c.start?dmy(c.start):'–')+' · tên, dạng, trạng thái tự lấy từ Meta</div></div>'+
    '<form id="cForm" style="display:flex;flex-direction:column;gap:12px">'+
    '<div class="field"><label for="cMsg">Thông điệp chính (key)</label><input type="text" id="cMsg" value="'+esc(c.message)+'" placeholder="Ví dụ: Êm chân, đi cả ngày không đau"></div>'+
    '<div class="field"><label for="cNote">Ghi chú</label><input type="text" id="cNote" value="'+esc(c.note)+'"></div>'+
    '<button class="btn primary block" type="submit">Lưu</button></form>'+
    (hist.length?'<div class="card"><div class="label" style="margin-bottom:6px">Số liệu theo ngày</div><div class="scroll-x"><table class="tbl num"><tr><th>Ngày</th><th>Chi phí</th><th>Tin nhắn</th><th>Đơn</th><th>CPA</th></tr>'+hist.map(function(a){
      var n=DB.orders.filter(function(o){return o.date===a.date&&o.content===c.code&&o.status!=='Hủy';}).length;
      return '<tr><td>'+dmy(a.date)+'</td><td>'+money(a.spend)+'</td><td>'+a.msgs+'</td><td>'+n+'</td><td>'+(n?money(a.spend/n):'–')+'</td></tr>'; }).join('')+'</table></div></div>':'');
  openSheet(esc(c.name),html,function(){
    $('cForm').addEventListener('submit',function(e){ e.preventDefault();
      run(api('saveContent',JSON.stringify({code:c.code,name:c.name,form:c.form,status:c.status,start:c.start,message:$('cMsg').value.trim(),note:$('cNote').value.trim()})),'Đã lưu'); });
  });
}

/* ================= SỔ QUỸ ================= */
$('cashAddBtn').addEventListener('click',function(){ openCash(); });
function renderCash(){
  var C=DB.cash;
  $('cashHero').innerHTML='<div class="label">Số dư quỹ hiện tại</div><div class="big num">'+money(C.balance)+' đ</div><div class="sub">Tự tính từ đơn hàng, nhập hàng, quảng cáo và thu chi ghi tay</div>';
  $('cashKpis').innerHTML=kpiBox('Tiền hàng đang giao',money(C.transit)+' đ','sẽ nhận khi giao thành công')+kpiBox('Còn nợ xưởng',money(C.owed)+' đ',C.owed?'xem ở Kho → Phiếu nhập':'đã trả đủ',C.owed?'':'');
  $('cashBreak').innerHTML=mrow('Thu ghi tay (vốn góp, thu khác)',C.inManual)+mrow('Tiền hàng đã nhận (đơn giao thành công)',C.received)+mrow('Phí GHN (ship, phí hoàn)',-C.ghn)+
    mrow('Đã trả xưởng',-C.paidFactory)+mrow('Chi quảng cáo Meta',-C.ads)+mrow('Chi ghi tay (vật tư, lương, khác)',-C.outManual)+'<div class="tot"><span>Số dư quỹ</span><b>'+money(C.balance)+' đ</b></div>';
  var list=DB.raw.cash.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  $('cashList').innerHTML=list.length?list.map(function(c){ return '<div class="item" style="cursor:default"><span class="t1">'+esc(c.category||c.type)+'</span><span class="r1 num" style="color:'+(c.type==='Thu'?'var(--good)':'var(--ink)')+'">'+(c.type==='Thu'?'+':'−')+money(c.amount)+'</span><span class="t2">'+dmy(c.date)+(c.desc?' · '+esc(c.desc):'')+'</span><span class="r2 muted small">'+esc(c.method)+'</span></div>'; }).join('')
    :'<div class="empty">Chưa có khoản thu chi nào.</div>';
}
function openCash(){
  var L=DB.lists;
  var html='<form id="cashForm" style="display:flex;flex-direction:column;gap:12px">'+
    '<p class="muted small" style="margin:0">Chỉ ghi các khoản ngoài bán hàng. Tiền COD, phí GHN, tiền trả xưởng và tiền quảng cáo đã được tính tự động.</p>'+
    '<div class="grid2"><div class="field"><label for="kDate">Ngày</label><input type="date" id="kDate" value="'+DB.today+'"></div><div class="field"><label for="kType">Loại</label>'+selectHtml('kType',L.types.length?L.types:['Thu','Chi'],'Chi')+'</div></div>'+
    '<div class="grid2"><div class="field"><label for="kCat">Danh mục</label>'+selectHtml('kCat',L.categories,'Vật tư đóng gói')+'</div><div class="field"><label for="kAmt">Số tiền (đ)</label><input type="number" id="kAmt" inputmode="numeric" min="0" step="1000" required></div></div>'+
    '<div class="grid2"><div class="field"><label for="kMethod">Hình thức</label>'+selectHtml('kMethod',L.methods,'Chuyển khoản')+'</div><div class="field"><label for="kDesc">Diễn giải</label><input type="text" id="kDesc"></div></div>'+
    '<button class="btn primary block" type="submit">Lưu</button></form>';
  openSheet('Ghi thu chi',html,function(){
    $('cashForm').addEventListener('submit',function(e){ e.preventDefault();
      run(api('addCash',JSON.stringify({date:$('kDate').value,type:$('kType').value,category:$('kCat').value,amount:$('kAmt').value,method:$('kMethod').value,desc:$('kDesc').value.trim()})),'Đã ghi thu chi'); });
  });
}

/* ================= khởi động ================= */
$('refreshBtn').addEventListener('click',function(){ load(); });
OSEG=store('kk-oseg')||'sum';
show(VIEWS.indexOf(store('kk-view'))>=0?store('kk-view'):'home');

/* ---------- đăng nhập (web online) ---------- */
function setUser(u){ $('userBtn').hidden=!u; $('userBtn').textContent=u?u+' · Thoát':''; }
function showLogin(msg){ $('login').hidden=false; $('lErr').textContent=msg&&msg!=='LOGIN'?msg:''; setTimeout(function(){ $('lUser').focus(); },50); }
$('loginForm').addEventListener('submit',function(e){ e.preventDefault();
  CRED={user:$('lUser').value.trim().toLowerCase(),pass:$('lPass').value}; $('lErr').textContent='Đang kiểm tra…';
  api('getData').then(function(){ store('kk-cred',JSON.stringify(CRED)); $('login').hidden=true; $('lPass').value=''; setUser(CRED.user); load(); })
    .catch(function(err){ $('lErr').textContent=err.message; });
});
$('userBtn').addEventListener('click',function(){ store('kk-cred',''); store('kk-data',''); CRED=null; DB=null; setUser(''); showLogin(); });
function boot(){
  if(MODE==='gas') return load();
  if(!SCRIPT_URL){ MODE='demo'; $('demoBadge').textContent='Dữ liệu mẫu · chưa nối Sheet'; return load(); }
  MODE='script';
  try{ CRED=JSON.parse(store('kk-cred')||'null'); }catch(e){ CRED=null; }
  if(CRED&&CRED.user){ setUser(CRED.user);
    var cached=store('kk-data'); // hiện ngay dữ liệu lần trước, rồi lấy bản mới ở nền
    if(cached){ try{ useData(cached,true); return load(true); }catch(e){} }
    load(); } else showLogin();
}
boot();
</script>
